<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Tree</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <h1>Decision Tree</h1>
    <div class="toolbar-actions">
      <button id="arrange-btn" title="Baum automatisch anordnen">Automatisch anordnen</button>
      <button id="reset-btn" title="Neuen Baum starten">Neuer Baum</button>
    </div>
  </header>

  <main id="canvas-wrapper">
    <div id="canvas">
      <svg id="edge-layer"></svg>
      <div id="node-layer"></div>
      <div id="label-layer"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-brand">
      <span class="toolbar-kicker">DECISION&nbsp;TREE</span>
      <h1>Baumstruktur</h1>
    </div>
    <div class="toolbar-actions">
      <button id="arrange-btn" title="Baum automatisch anordnen">Anordnen</button>
    </div>
  </header>

  <nav id="tabbar">
    <div id="tab-list"></div>
    <button id="new-tab-btn" type="button" title="Neues Diagramm">+</button>
  </nav>

  <main id="canvas-wrapper">
    <div id="canvas">
      <svg id="edge-layer"></svg>
      <div id="node-layer"></div>
      <div id="label-layer"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
